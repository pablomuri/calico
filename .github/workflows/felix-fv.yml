    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          docker system prune -af
          df -h

      - name: Enable IPv6 and SCTP for Docker
        run: |
          sudo bash -c 'cat > /etc/docker/daemon.json <<EOF
          {
            "ipv6": true,
            "fixed-cidr-v6": "2001:db8:1::/64"
          }
          EOF'
          sudo systemctl restart docker
          sudo modprobe sctp

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Touch generated proto files
        run: touch felix/proto/felixbackend.pb.go felix/proto/felixbackend_grpc.pb.go

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Felix FV tests
        env:
          FELIX_FV_BPFATTACHTYPE: ${{ matrix.FELIX_FV_BPFATTACHTYPE }}
        run: |
          make -C felix fv \
            FV_NUM_BATCHES=${{ matrix.FV_NUM_BATCHES }} \
            FV_BATCHES_TO_RUN=${{ matrix.FV_BATCHES_TO_RUN }} \
            FELIX_FV_NFTABLES="${{ matrix.FELIX_FV_NFTABLES }}" \
            FELIX_FV_ENABLE_BPF="${{ matrix.FELIX_FV_ENABLE_BPF }}" \
            GINKGO_FOCUS="${{ matrix.GINKGO_FOCUS }}" \
            GIT_VERSION=v0.0.0-fv-test
