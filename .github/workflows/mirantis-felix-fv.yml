name: Felix FV tests

on:
  workflow_dispatch:

jobs:
  felix-fv:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180

    strategy:
      fail-fast: false
      matrix:
        include:
          # iptables on Ubuntu 22.04 — 8 batches
          - name: "Felix FV: iptables (1/8)"
            runner: ubuntu-22.04
            FV_NUM_BATCHES: "8"
            FV_BATCHES_TO_RUN: "1"
          - name: "Felix FV: iptables (2/8)"
            runner: ubuntu-22.04
            FV_NUM_BATCHES: "8"
            FV_BATCHES_TO_RUN: "2"
          - name: "Felix FV: iptables (3/8)"
            runner: ubuntu-22.04
            FV_NUM_BATCHES: "8"
            FV_BATCHES_TO_RUN: "3"
          - name: "Felix FV: iptables (4/8)"
            runner: ubuntu-22.04
            FV_NUM_BATCHES: "8"
            FV_BATCHES_TO_RUN: "4"
          - name: "Felix FV: iptables (5/8)"
            runner: ubuntu-22.04
            FV_NUM_BATCHES: "8"
            FV_BATCHES_TO_RUN: "5"
          - name: "Felix FV: iptables (6/8)"
            runner: ubuntu-22.04
            FV_NUM_BATCHES: "8"
            FV_BATCHES_TO_RUN: "6"
          - name: "Felix FV: iptables (7/8)"
            runner: ubuntu-22.04
            FV_NUM_BATCHES: "8"
            FV_BATCHES_TO_RUN: "7"
          - name: "Felix FV: iptables (8/8)"
            runner: ubuntu-22.04
            FV_NUM_BATCHES: "8"
            FV_BATCHES_TO_RUN: "8"

          # nftables on Ubuntu 22.04 — 8 batches
          - name: "Felix FV: nftables (1/8)"
            runner: ubuntu-22.04
            FV_NUM_BATCHES: "8"
            FV_BATCHES_TO_RUN: "1"
            FELIX_FV_NFTABLES: "Enabled"
          - name: "Felix FV: nftables (2/8)"
            runner: ubuntu-22.04
            FV_NUM_BATCHES: "8"
            FV_BATCHES_TO_RUN: "2"
            FELIX_FV_NFTABLES: "Enabled"
          - name: "Felix FV: nftables (3/8)"
            runner: ubuntu-22.04
            FV_NUM_BATCHES: "8"
            FV_BATCHES_TO_RUN: "3"
            FELIX_FV_NFTABLES: "Enabled"
          - name: "Felix FV: nftables (4/8)"
            runner: ubuntu-22.04
            FV_NUM_BATCHES: "8"
            FV_BATCHES_TO_RUN: "4"
            FELIX_FV_NFTABLES: "Enabled"
          - name: "Felix FV: nftables (5/8)"
            runner: ubuntu-22.04
            FV_NUM_BATCHES: "8"
            FV_BATCHES_TO_RUN: "5"
            FELIX_FV_NFTABLES: "Enabled"
          - name: "Felix FV: nftables (6/8)"
            runner: ubuntu-22.04
            FV_NUM_BATCHES: "8"
            FV_BATCHES_TO_RUN: "6"
            FELIX_FV_NFTABLES: "Enabled"
          - name: "Felix FV: nftables (7/8)"
            runner: ubuntu-22.04
            FV_NUM_BATCHES: "8"
            FV_BATCHES_TO_RUN: "7"
            FELIX_FV_NFTABLES: "Enabled"
          - name: "Felix FV: nftables (8/8)"
            runner: ubuntu-22.04
            FV_NUM_BATCHES: "8"
            FV_BATCHES_TO_RUN: "8"
            FELIX_FV_NFTABLES: "Enabled"

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          docker system prune -af
          df -h

      - name: Configure kernel modules and Docker
        run: |
          sudo bash -c 'cat > /etc/docker/daemon.json <<EOF
          {
            "ipv6": true,
            "fixed-cidr-v6": "2001:db8:1::/64"
          }
          EOF'
          sudo systemctl restart docker
          sudo modprobe ipip
          sudo modprobe ip6_tunnel
          sudo modprobe vxlan
          sudo modprobe sctp
          sudo sysctl -w net.ipv4.conf.all.rp_filter=2

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Touch generated proto files
        run: touch felix/proto/felixbackend.pb.go felix/proto/felixbackend_grpc.pb.go

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Felix FV tests
        run: |
          make -C felix fv \
            FV_NUM_BATCHES=${{ matrix.FV_NUM_BATCHES }} \
            FV_BATCHES_TO_RUN=${{ matrix.FV_BATCHES_TO_RUN }} \
            FELIX_FV_NFTABLES="${{ matrix.FELIX_FV_NFTABLES }}" \
            GINKGO_FOCUS="${{ matrix.GINKGO_FOCUS }}" \
            GIT_VERSION=v0.0.0-fv-test
